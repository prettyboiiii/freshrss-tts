name: image
on:
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, Dockerfile, src/**, vendor/**, .github/workflows/image.yaml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 only: it runs on the GPU node (debian).
          platforms: linux/amd64
          tags: |
            ghcr.io/prettyboiiii/freshrss-tts:latest
            ghcr.io/prettyboiiii/freshrss-tts:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
